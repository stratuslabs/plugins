name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: List packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the CI scripts
        run: node --test .github/scripts/*.test.mjs

      # A pull request runs only the packages it touches (all of them when it
      # changes .github/). macOS minutes cost more on a private repository.
      - name: Files this pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # --no-renames: a file moved out of a package counts for that package too.
        run: git diff --name-only --no-renames "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"

      - name: List packages and their runners
        id: list
        run: |
          if [ -f "$RUNNER_TEMP/changed.txt" ]; then
            node .github/scripts/packages.mjs . --changed "$RUNNER_TEMP/changed.txt"
          else
            node .github/scripts/packages.mjs .
          fi

  test:
    name: ${{ matrix.package }} (${{ matrix.runner }})
    needs: packages
    if: needs.packages.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.packages.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --no-package-lock
          fi

      - name: Test
        run: npm test
